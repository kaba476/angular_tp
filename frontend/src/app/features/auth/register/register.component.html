<div class="auth-page">
  <div class="auth-card">
    <h2>Créer un compte</h2>

    @if (error) {
      <p class="error">{{ error }}</p>
    }

    <form #form="ngForm" (ngSubmit)="register()">
      <div class="form-group">
        <label>Nom</label>
        <input class="form-control" type="text" name="name" [(ngModel)]="user.name" required />
      </div>

      <div class="form-group">
        <label>Email</label>
        <input class="form-control" type="email" name="email" [(ngModel)]="user.email" required email />
      </div>

      <div class="form-group">
        <label>Mot de passe</label>
        <input class="form-control" type="password" name="password" [(ngModel)]="user.password" required minlength="8" />
        <small class="text-muted">Minimum 8 caractères requis</small>
      </div>

      <div class="form-group">
        <label>Confirmation</label>
        <input class="form-control" type="password" name="password_confirmation" [(ngModel)]="user.password_confirmation" required />
      </div>

      <button class="btn btn-primary" type="submit" [disabled]="form.invalid">S'inscrire</button>
    </form>

    <p class="text-center mt-2">Déjà un compte ? <a routerLink="/login">Se connecter</a></p>
  </div>
</div>
