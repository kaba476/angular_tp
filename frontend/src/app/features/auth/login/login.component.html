<div class="auth-page">
  <div class="auth-card">
    <h2>Bienvenue</h2>

    @if (error) {
      <p class="error">{{ error }}</p>
    }

    <form #form="ngForm" (ngSubmit)="login()">
      <div class="form-group">
        <label>Email</label>
        <input class="form-control" type="email" name="email" [(ngModel)]="credentials.email" required email />
      </div>

      <div class="form-group">
        <label>Mot de passe</label>
        <input class="form-control" type="password" name="password" [(ngModel)]="credentials.password" required />
      </div>

      <button class="btn btn-primary" type="submit" [disabled]="form.invalid">Se connecter</button>
    </form>

    <p class="text-center mt-2">Pas encore de compte ? <a routerLink="/register">S'inscrire</a></p>
  </div>
</div>
